spring.application.name=dineease
server.port=${PORT:8080}
# Default: file-based H2 database (no installation needed)
spring.datasource.url=jdbc:h2:file:./data/dineease;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# PostgreSQL: comment out the H2 lines above and uncomment these
#spring.datasource.url=jdbc:postgresql://localhost:5432/dineease
#spring.datasource.username=postgres
