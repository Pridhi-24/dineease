<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin - Tables')}"></head>
<body>
<div class="adm">
<aside th:replace="~{fragments :: adminSide}"></aside>
<main class="main">
<div class="hdr"><h2 style="margin:0">Tables</h2>
  <div class="row"><span class="sm mut" th:text="${free} + ' free &middot; ' + ${occupied} + ' occupied &middot; ' + ${views.size()} + ' total'"></span>
    <a class="btn btn-o" th:href="@{/admin/walkins}">Walk in</a><a class="btn btn-gold" th:href="@{/admin/tables#form}">+ Add table</a></div></div>
<div class="lg"><span style="--c:#4caf6a"><i style="background:var(--c)"></i>Available</span><span style="--c:#C6A66B"><i style="background:var(--c)"></i>Reserved</span><span style="--c:#d0574d"><i style="background:var(--c)"></i>Occupied</span><span style="--c:#8a948f"><i style="background:var(--c)"></i>Unavailable</span>
  <span class="mut" th:text="'Status shown for ' + ${@fmt.time(now)} + ' today. Click a table to edit or delete it.'"></span></div>
<div class="plan">
  <aside class="rl"><div class="rh"><b>Today</b><span th:text="${@fmt.date(today)}"></span></div>
    <div class="rr" th:each="r : ${todayRes}"><span th:text="${r.partySize}">2</span><em th:text="${@fmt.name(r.userId)}">Name</em><b th:text="${@fmt.time(r.reservationTime)}">7:00 PM</b></div>
    <div class="rr" style="display:block;color:#ffffff99" th:if="${todayRes.isEmpty()}">No reservations today</div></aside>
  <div class="fl">
    <a class="tbw" th:each="v : ${views}" th:classappend="'s-' + ${v.state}" th:href="@{/admin/tables(edit=${v.table.tableId})}" th:title="'Edit or delete table ' + ${v.table.tableNumber}">
      <div class="chs"><i class="ch" th:each="i : ${v.topSeats}"></i></div>
      <div class="tbx" th:style="'width:' + ${v.width} + 'px'"><span class="no" th:text="${v.table.tableNumber}">1</span><span class="inf" th:text="${v.info}">info</span></div>
      <div class="chs"><i class="ch" th:each="i : ${v.botSeats}"></i></div>
    </a>
    <p style="color:#ffffff99" th:if="${views.isEmpty()}">No tables yet. Add your first table below.</p>
  </div>
</div>
<form id="form" class="card" style="max-width:560px;margin-top:24px" th:action="@{/admin/tables}" method="post">
  <h3 th:text="${edit != null} ? 'Edit table ' + ${edit.tableNumber} : 'Add table'">Add table</h3>
  <input type="hidden" name="id" th:if="${edit != null}" th:value="${edit.tableId}">
  <div class="two">
    <div class="f"><label for="tableNumber">Table number</label><input id="tableNumber" name="tableNumber" type="number" min="1" required th:value="${edit?.tableNumber}"></div>
    <div class="f"><label for="capacity">Seating capacity</label><input id="capacity" name="capacity" type="number" min="1" max="20" required th:value="${edit != null} ? ${edit.capacity} : 2"></div>
  </div>
  <div class="two">
    <div class="f"><label for="location">Location</label><select id="location" name="location"><option th:each="l : ${ {'indoor','outdoor','window'} }" th:value="${l}" th:text="${locs.get(l)}" th:selected="${edit != null and edit.location==l}"></option></select></div>
    <div class="f"><label for="status">Status</label><select id="status" name="status"><option th:each="s : ${ {'available','occupied','unavailable'} }" th:value="${s}" th:text="${s}" th:selected="${edit != null and edit.status==s}"></option></select></div>
  </div>
  <div class="row"><button class="btn btn-p">Save table</button><a class="btn btn-o" th:if="${edit != null}" th:href="@{/admin/tables}">Cancel</a></div>
</form>
<form class="card" style="max-width:560px;margin-top:14px" th:if="${edit != null}" th:action="@{/admin/tables/{id}/delete(id=${edit.tableId})}" method="post" data-confirm="Delete this table permanently?">
  <p class="mut sm">Deleting is permanent and blocked while the table has upcoming reservations.</p><button class="btn btn-d">Delete table</button>
</form>
</main>
</div>
<div th:replace="~{fragments :: toasts}"></div>
</body>
</html>
